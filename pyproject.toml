[project]
name = "spritesheet-expert-suite"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Pillow==12.3.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
